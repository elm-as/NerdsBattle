<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, sans-serif">
  <!-- Background -->
  <defs>
    <radialGradient id="glow" cx="85%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="110%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="1" opacity="0.5" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0a0a0a" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- Frame corners -->
  <g stroke="#3b82f6" stroke-width="2" fill="none">
    <path d="M 50 50 L 50 90 M 50 50 L 90 50" />
    <path d="M 1150 50 L 1150 90 M 1150 50 L 1110 50" />
    <path d="M 50 580 L 50 540 M 50 580 L 90 580" />
    <path d="M 1150 580 L 1150 540 M 1150 580 L 1110 580" />
  </g>

  <!-- Top label -->
  <g transform="translate(80, 95)">
    <rect width="40" height="2" y="-6" fill="#3b82f6" />
    <text x="56" y="0" fill="#3b82f6" font-size="16" font-weight="700" letter-spacing="6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      SYSTEM // ONLINE
    </text>
  </g>

  <!-- Main wordmark -->
  <g transform="translate(80, 280)">
    <text fill="#ffffff" font-size="170" font-weight="900" letter-spacing="-6">
      ELMAS
    </text>
    <text y="160" fill="#ffffff" font-size="170" font-weight="900" letter-spacing="-6">
      CORE<tspan fill="#3b82f6">.</tspan>
    </text>
  </g>

  <!-- Tagline -->
  <g transform="translate(80, 510)">
    <text fill="#9ca3af" font-size="22" font-weight="500" letter-spacing="0.5">
      Architecte Systèmes • IA • Sécurité • Data
    </text>
    <text y="38" fill="#6b7280" font-size="14" font-weight="600" letter-spacing="4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      ELMAS.SOLUTIONS
    </text>
  </g>

  <!-- Right-side decorative tech blocks -->
  <g transform="translate(880, 130)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect width="240" height="100" rx="14" fill="#121212" stroke="#262626" />
    <text x="20" y="32" fill="#6b7280" font-size="11" font-weight="700" letter-spacing="3">NODE_01</text>
    <text x="20" y="64" fill="#3b82f6" font-size="22" font-weight="800">PRODUCTION</text>
    <text x="20" y="86" fill="#9ca3af" font-size="12" letter-spacing="2">UPTIME 99.9%</text>
  </g>

  <g transform="translate(880, 250)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect width="240" height="100" rx="14" fill="#121212" stroke="#3b82f6" stroke-opacity="0.3" />
    <text x="20" y="32" fill="#6b7280" font-size="11" font-weight="700" letter-spacing="3">NODE_02</text>
    <text x="20" y="64" fill="#ffffff" font-size="22" font-weight="800">AI / SECURITY</text>
    <text x="20" y="86" fill="#9ca3af" font-size="12" letter-spacing="2">ACTIVE LABS</text>
  </g>

  <g transform="translate(880, 370)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect width="240" height="100" rx="14" fill="#121212" stroke="#262626" />
    <text x="20" y="32" fill="#6b7280" font-size="11" font-weight="700" letter-spacing="3">NODE_03</text>
    <text x="20" y="64" fill="#ffffff" font-size="22" font-weight="800">FULLSTACK</text>
    <text x="20" y="86" fill="#9ca3af" font-size="12" letter-spacing="2">REACT • SUPABASE</text>
  </g>
</svg>
